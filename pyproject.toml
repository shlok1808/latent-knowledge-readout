[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-knowledge-readout"
version = "0.1.0"
description = "TextCraft early failure probe reproduction and within-task diagnostics"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers>=4.56,<6", "huggingface-hub>=0.30", "numpy>=1.26", "scikit-learn>=1.5", "gymnasium>=1.0", "safetensors>=0.5"]

[dependency-groups]
# Scribe notebook MCP for the experimenter agent (pinned commit; see the research plugin's SETUP.md)
agent = ["scribe @ git+https://github.com/goodfire-ai/scribe.git@981047904e8ef874dc200689d9f2286afc779219"]

[tool.uv]
# Keep Scribe on every plain `uv sync`; without it, sync removes Scribe and the MCP server breaks.
default-groups = ["agent"]

# Lambda's driver is CUDA 12.8 (570.x); PyPI's newest torch is built for CUDA 13 and can't see the GPU there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
failure-probes = "failure_probes.cli:main"

[tool.setuptools.packages.find]
include = ["failure_probes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
